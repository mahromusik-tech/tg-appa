<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>2048 Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #121212;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 480px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #ffcc00;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      background: #1f1f1f;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: right;
      min-width: 60px;
    }

    .stat .label {
      font-size: 10px;
      text-transform: uppercase;
      color: #aaaaaa;
    }

    .stat span:last-child {
      font-size: 16px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      background: #2b2b2b;
      color: #f5f5f5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
      background: #3a3a3a;
    }

    #game-container {
      position: relative;
      background: #1b1b1b;
      border-radius: 12px;
      padding: 10px;
    }

    #grid {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
    }

    .tile {
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 22px;
      transition: transform 0.08s ease-out, background 0.1s ease-out;
    }

    .tile.empty {
      background: #252525;
    }

    .tile:not(.empty) {
      color: #222;
    }

    /* Цвета тайлов */
    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; }
    .tile-256 { background: #edcc61; color: #f9f6f2; }
    .tile-512 { background: #edc850; color: #f9f6f2; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none;
    }

    .overlay-content {
      text-align: center;
      padding: 16px;
      background: #1f1f1f;
      border-radius: 10px;
      width: 80%;
    }

    .overlay-content h2 {
      margin-bottom: 8px;
    }

    .overlay-content p {
      margin-bottom: 12px;
      font-size: 14px;
      color: #cccccc;
      white-space: pre-line;
    }

    /* Модалка магазина */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #1f1f1f;
      padding: 16px;
      border-radius: 10px;
      width: 90%;
      max-width: 360px;
    }

    .modal-content h2 {
      margin-bottom: 8px;
    }

    .modal-content p {
      margin-bottom: 8px;
      font-size: 14px;
      color: #cccccc;
    }

    .modal-content ul {
      margin-left: 16px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #bbbbbb;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="logo">2048</div>
      <div class="stats">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span id="best">0</span>
        </div>
        <div class="stat">
          <span class="label">XP</span>
          <span id="xp">0</span>
        </div>
      </div>
    </header>

    <main>
      <div class="controls">
        <button id="new-game">New game</button>
        <button id="shop-btn">Shop (soon)</button>
      </div>

      <div id="game-container">
        <div id="grid"></div>
        <div id="overlay" class="hidden">
          <div class="overlay-content">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-text"></p>
            <button id="try-again">Try again</button>
          </div>
        </div>
      </div>
    </main>

 
  </div>

  <script>
    const SIZE = 4;

    let grid = [];
    let score = 0;
    let bestScore = 0;
    let xp = 0;

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const xpEl = document.getElementById('xp');
    const gridEl = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');

    const newGameBtn = document.getElementById('new-game');
    const tryAgainBtn = document.getElementById('try-again');
    const shopBtn = document.getElementById('shop-btn');
    const shopModal = document.getElementById('shop-modal');
    const closeShopBtn = document.getElementById('close-shop');

    // LocalStorage
    function loadProgress() {
      try {
        bestScore = parseInt(localStorage.getItem('bestScore2048') || '0', 10);
        xp = parseInt(localStorage.getItem('xp2048') || '0', 10);
      } catch (e) {
        bestScore = 0;
        xp = 0;
      }
      bestEl.textContent = bestScore;
      xpEl.textContent = xp;
    }

    function saveProgress() {
      try {
        localStorage.setItem('bestScore2048', String(bestScore));
        localStorage.setItem('xp2048', String(xp));
      } catch (e) {
        // в Telegram WebApp localStorage может быть недоступен — тогда просто игнорируем
      }
    }

    // Game logic
    function initGrid() {
      grid = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          row.push(0);
        }
        grid.push(row);
      }
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) emptyCells.push({ r, c });
        }
      }
      if (emptyCells.length === 0) return;

      const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function startGame() {
score = 0;
      updateScore(0, true);
      initGrid();
      addRandomTile();
      addRandomTile();
      renderGrid();
      hideOverlay();
    }

    function updateScore(delta, reset = false) {
      if (reset) score = 0;
      else score += delta;

      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestEl.textContent = bestScore;
      }
    }

    function addXp(amount) {
      xp += amount;
      xpEl.textContent = xp;
      saveProgress();
    }

    // Rendering
    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const value = grid[r][c];
          const tile = document.createElement('div');
          tile.classList.add('tile');
          if (value === 0) {
            tile.classList.add('empty');
          } else {
            tile.textContent = value;
            tile.classList.add(`tile-${value}`);
          }
          gridEl.appendChild(tile);
        }
      }
    }

    // Moves
    function slideRowLeft(row) {
      const filtered = row.filter(v => v !== 0);
      const merged = [];
      let scoreGain = 0;

      for (let i = 0; i < filtered.length; i++) {
        if (filtered[i] === filtered[i + 1]) {
          const newVal = filtered[i] * 2;
          merged.push(newVal);
          scoreGain += newVal;
          i++;
        } else {
          merged.push(filtered[i]);
        }
      }

      while (merged.length < SIZE) {
        merged.push(0);
      }

      return { row: merged, scoreGain };
    }

    function rotateGridClockwise(g) {
      const newGrid = [];
      for (let c = 0; c < SIZE; c++) {
        const newRow = [];
        for (let r = SIZE - 1; r >= 0; r--) {
          newRow.push(g[r][c]);
        }
        newGrid.push(newRow);
      }
      return newGrid;
    }

    function rotateGridCounterClockwise(g) {
      const newGrid = [];
      for (let c = SIZE - 1; c >= 0; c--) {
        const newRow = [];
        for (let r = 0; r < SIZE; r++) {
          newRow.push(g[r][c]);
        }
        newGrid.push(newRow);
      }
      return newGrid;
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function moveLeft() {
      let moved = false;
      let totalGain = 0;

      for (let r = 0; r < SIZE; r++) {
        const { row: newRow, scoreGain } = slideRowLeft(grid[r]);
        if (!arraysEqual(newRow, grid[r])) {
          moved = true;
          grid[r] = newRow;
        }
        totalGain += scoreGain;
      }

      if (moved) {
        updateScore(totalGain);
        addRandomTile();
        renderGrid();
        checkGameState();
      }
    }

    function moveRight() {
      grid = grid.map(row => row.reverse());
      moveLeft();
      grid = grid.map(row => row.reverse());
    }

    function moveUp() {
      grid = rotateGridCounterClockwise(grid);
      moveLeft();
      grid = rotateGridClockwise(grid);
    }

    function moveDown() {
      grid = rotateGridClockwise(grid);
      moveLeft();
      grid = rotateGridCounterClockwise(grid);
    }

    // Game state
    function hasMoves() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) return true;
        }
      }
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const v = grid[r][c];
          if (r < SIZE - 1 && grid[r + 1][c] === v) return true;
          if (c < SIZE - 1 && grid[r][c + 1] === v) return true;
        }
      }
      return false;
    }

    function has2048() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 2048) return true;
        }
      }
      return false;
    }

    function showOverlay(title, text) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function checkGameState() {
      if (has2048()) {
        addXp(score);
        showOverlay('You win!', `Score: ${score}\nXP +${score}`);
        return;
      }

      if (!hasMoves()) {
        addXp(score);
        showOverlay('Game Over', `Score: ${score}\nXP +${score}`);
      }
    }

    // Keyboard
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowLeft':
          e.preventDefault();
          moveLeft();
          break;
        case 'ArrowRight':
          e.preventDefault();
          moveRight();
          break;
        case 'ArrowUp':
          e.preventDefault();
          moveUp();
          break;
        case 'ArrowDown':
          e.preventDefault();
          moveDown();
          break;
      }
    });

    // Touch (swipes)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const MIN_SWIPE = 30;

    gridEl.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchEndX = touchStartX;
      touchEndY = touchStartY;
    });

    gridEl.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      touchEndX = touch.clientX;
      touchEndY = touch.clientY;
    });

    gridEl.addEventListener('touchend', () => {
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      if (Math.abs(dx) < MIN_SWIPE && Math.abs(dy) < MIN_SWIPE) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) moveRight();
        else moveLeft();
      } else {
        if (dy > 0) moveDown();
        else moveUp();
      }
    });

    // UI buttons
    newGameBtn.addEventListener('click', startGame);
    tryAgainBtn.addEventListener('click', startGame);

    shopBtn.addEventListener('click', () => {
      shopModal.classList.remove('hidden');
    });

    closeShopBtn.addEventListener('click', () => {
      shopModal.classList.add('hidden');
    });

    // Init
    loadProgress();
    startGame();
  </script>
      </body>
</html>
