<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Simulator</title>
    <style>
        :root {
            --primary: #5c9ded;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h1, h2 { text-align: center; margin-top: 0; }

        /* Стили для стартового экрана */
        .start-screen { display: flex; flex-direction: column; gap: 15px; }
        input, select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            width: 100%;
        }
        button:active { transform: scale(0.98); }

        /* Стили для основного экрана */
        .game-screen { display: none; }
        
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-weight: bold; font-size: 16px; }

        .avatar-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            background: #eee;
        }

        .event-log {
            flex-grow: 1;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        .log-age { font-weight: bold; color: var(--primary); }

        /* Модальное окно выбора */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            text-align: center;
        }
        .choice-btn {
            margin-top: 10px;
            background: #fff;
            color: var(--text);
            border: 2px solid var(--primary);
        }
        .choice-btn:hover { background: #f0f7ff; }

    </style>
</head>
<body>
  <div class="container">
      <!-- Экран создания -->
    <div id="startScreen" class="start-screen">
        <h2>Новая жизнь</h2>
        <input type="text" id="nameInput" placeholder="Введите имя" maxlength="15">
        <select id="genderInput">
            <option value="male">Мальчик</option>
            <option value="female">Девочка</option>
        </select>
        <button onclick="startGame()">Родиться</button>
    </div>

    <!-- Экран игры -->
    <div id="gameScreen" class="game-screen">
        <div class="stats-bar">
            <div class="stat-item">❤️ <span class="stat-val" id="healthVal">100</span></div>
            <div class="stat-item">😊 <span class="stat-val" id="happyVal">100</span></div>
            <div class="stat-item">💰 <span class="stat-val" id="moneyVal">0</span></div>
        </div>

        <div class="avatar-container">
            <img id="avatarImg" class="avatar-img" src="" alt="Avatar">
            <h2 id="displayName" style="margin: 10px 0 5px;">Имя</h2>
            <div style="color: #666;">Возраст: <span id="ageVal">0</span> лет</div>
        </div>

        <div id="eventLog" class="event-log">
            <div class="log-entry">Вы родились! Добро пожаловать в этот мир.</div>
        </div>

        <button id="ageBtn" onclick="nextYear()">Прожить год</button>
    </div>

    <!-- Модалка выбора -->
    <div id="choiceModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="choiceTitle">Выбор</h3>
            <div id="choiceButtons"></div>
        </div>
    </div>
</div>

<script>
    // --- ДАННЫЕ ---
    
    // Заглушки для картинок (Вам нужно заменить их на реальные пути к файлам)
    // Например: 'img/boy1.png', 'img/boy2.png'...
    const avatars = {
        male: [
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Felix', 
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Max', 
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Alex'
        ],
        female: [
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Bella', 
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Sophie', 
            'https://api.dicebear.com/7.x/avataaars/svg?seed=Lilly'
        ]
    };

    let player = {
        name: "",
        gender: "male",
        age: 0,
        month: 0, // Добавили счетчик месяцев
        health: 100,
        happiness: 100,
        money: 0,
        avatar: ""
    };

    // --- СЦЕНАРИИ (0-6 лет) ---
     eventsDb = {
       // --- БАЗА СОБЫТИЙ (0-6 ЛЕТ) ---
    
    // Случайные события (без выбора), привязанные к возрасту
    const randomEvents = {
        0: [
            "Вы смачно срыгнули на плечо папе.",
            "Вы обнаружили, что у вас есть ноги. Шок!",
            "Вам приснилась гигантская сиська.",
            "Вы орали 3 часа подряд без причины. Родители в восторге.",
            "Вас искупали в травах. Вы пахнете как чайный пакетик.",
            "Вы научились переворачиваться на живот. Теперь мир выглядит иначе.",
            "Бабушка сказала, что вы копия деда. Надеемся, это комплимент."
        ],
        1: [
            "Вы попробовали на вкус кошачий хвост. Шерстисто.",
            "Вы научились говорить 'НЕТ'. Теперь это ваш ответ на всё.",
            "Вы размазали кашу по лицу. Это абстракционизм.",
            "Вы сделали первые шаги и сразу упали на попу.",
            "Вы нашли пульт от телевизора и спрятали его в кастрюлю.",
            "Вам подарили плюшевого медведя. Он теперь ваш лучший друг."
        ],
        2: [
            "Вы разрисовали обои фломастерами. Мама плачет, папа смеется.",
            "Вы научились прыгать на двух ногах.",
            "Вы отказались есть суп и потребовали конфету.",
            "Вы увидели голубя и побежали за ним с криком 'Гуля!'",
            "Вы надели мамины туфли и упали.",
            "Вы выучили плохое слово, услышав, как папа чинит кран."
        ],
        3: [
            "В садике давали манную кашу с комочками. Фу.",
            "Вы подружились с мальчиком, у которого есть крутая машинка.",
            "Вы слепили из пластилина нечто похожее на червяка.",
            "Вы научились врать, что это не вы разбили чашку.",
            "Вы нашли жука. Он красивый и блестящий.",
            "Вас укусил комар. Чешется!"
        ],
        4: [
            "Вы научились кататься на трехколесном велосипеде.",
            "Вы спросили у мамы, откуда берутся дети. Мама покраснела.",
            "Вы построили шалаш из подушек и одеял.",
            "Вы нашли 10 рублей на улице. Богатство!",
            "Вы посмотрели страшный мультик и боялись спать.",
            "Вы помогали папе забивать гвоздь (держали молоток)."
        ],
        5: [
            "У вас выпал первый молочный зуб. Ждете фею.",
            "Вы научились читать по слогам: 'МА-МА МЫ-ЛА РА-МУ'.",
            "Вы влюбились в девочку/мальчика из старшей группы.",
            "Вы украли конфету из вазы, пока никто не видел.",
            "Вы научились свистеть (почти).",
            "Вы поймали лягушку на даче."
        ],
        6: [
            "Вам купили портфель. Он огромный.",
            "Вы научились завязывать шнурки (с третьей попытки).",
            "Вы разбили коленку, но не плакали. Герой!",
            "Вы играли в прятки и уснули в шкафу.",
            "Скоро в школу. Все говорят об этом с ужасом.",
            "Вы нашли старый журнал с картинками."
        ]
    };
    ];

    // Сценарные выборы (триггеры), срабатывают с шансом
      // Сценарные выборы (триггеры), срабатывают с шансом
    const scenarios = [
        {
            minAge: 0, maxAge: 0, chance: 0.1, // 10% шанс каждый месяц в 0 лет
            text: "Вам предлагают соску. Ваши действия?",
            options: [
                { text: "Взять и сосать", effect: { happy: 5, health: 0 }, log: "Успокоение. Жизнь хороша." },
                { text: "Выплюнуть далеко", effect: { happy: 10, health: 0 }, log: "Соска улетела под диван. Свобода!" }
            ]
        },
        {
            minAge: 1, maxAge: 2, chance: 0.05,
            text: "Вы видите розетку. Она выглядит как пятачок свиньи.",
            options: [
                { text: "Сунуть пальцы", effect: { happy: -20, health: -10 }, log: "Вас ударило током! Больно и обидно." },
                { text: "Пройти мимо", effect: { happy: 0, health: 0 }, log: "Инстинкт самосохранения сработал." }
            ]
        },
        {
            minAge: 3, maxAge: 4, chance: 0.08,
            text: "В песочнице у вас отбирают лопатку.",
            options: [
                { text: "Драться!", effect: { happy: 5, health: -5 }, log: "Вы победили, но получили песком в глаза." },
                { text: "Отдать и плакать", effect: { happy: -10, health: 0 }, log: "Лопатку забрали, зато мама пожалела." }
            ]
        },
        {
            minAge: 5, maxAge: 6, chance: 0.08,
            text: "Мама заставляет есть брокколи.",
            options: [
                { text: "Съесть через силу", effect: { happy: -5, health: 5 }, log: "Гадость, зато полезно." },
                { text: "Выкинуть собаке", effect: { happy: 5, health: 0 }, log: "Собака съела, мама довольна пустой тарелкой." }
            ]
        }
        ];

    // --- ЛОГИКА ---

    function startGame() {
        const name = document.getElementById('nameInput').value;
        if (!name) return alert("Введите имя!");

        player.name = name;
        player.gender = document.getElementById('genderInput').value;
        
        // Рандомный выбор аватара
        const avatarList = avatars[player.gender];
        player.avatar = avatarList[Math.floor(Math.random() * avatarList.length)];

        // Обновление UI
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('displayName').innerText = player.name;
        document.getElementById('avatarImg').src = player.avatar;
        
        updateStats();
    }

    function nextYear() {
       function nextMonth() {
        player.month++;
        
        // Проверка смены года
        if (player.month >= 12) {
            player.age++;
            player.month = 0;
            addLog(`🎂 <b>С Днем Рождения! Вам исполнилось ${player.age} лет!</b>`);
        }

        // Проверка конца демо-версии
        if (player.age > 6) {
            alert("Демо-версия окончена! Вы выросли.");
            return;
        }

        // 1. Сначала проверяем, выпадет ли событие с выбором (Scenario)
        // Ищем подходящие сценарии по возрасту
        const possibleScenarios = scenarios.filter(s => player.age >= s.minAge && player.age <= s.maxAge);
        
        // Пробуем запустить сценарий
        for (let s of possibleScenarios) {
            if (Math.random() < s.chance) {
                showChoice(s);
                updateStats(); // Обновляем цифры перед показом модалки
                return; // Прерываем ход, ждем выбора игрока
            }
        }

        // 2. Если выбора нет, просто случайное событие из базы
        processRandomEvent();
        updateStats();}

    function processRandomEvent() {
        const list = randomEvents[player.age];
        if (!list) {
            addLog("Обычный месяц. Ничего не произошло.");
            return;
        }
        
        const text = list[Math.floor(Math.random() * list.length)];
        
        // Случайные колебания статов каждый месяц
        player.happiness += Math.floor(Math.random() * 5) - 1; // -1 до +3
        player.health += Math.floor(Math.random() * 3) - 1;    // -1 до +1

        addLog(text);}

    function showChoice(choiceData) {
        const modal = document.getElementById('choiceModal');
        const title = document.getElementById('choiceTitle');
        const btnContainer = document.getElementById('choiceButtons');

        title.innerText = choiceData.text;
        btnContainer.innerHTML = '';

        choiceData.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = opt.text;
            btn.onclick = () => makeChoice(opt);
            btnContainer.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    function makeChoice(option) {
        // Применяем эффекты
        if (option.effect.happy) player.happiness += option.effect.happy;
        if (option.effect.health) player.health += option.effect.health;
        if (option.effect.money) player.money += option.effect.money;

        addLog(option.log);
        updateStats();
        document.getElementById('choiceModal').style.display = 'none';
    }

    function addLog(text) {
        const log = document.getElementById('eventLog');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-age">${player.age} лет:</span> ${text}`;
        log.prepend(entry); // Новые сверху
    }

    // Было: document.getElementById('ageVal').innerText = player.age;
    // Стало:
    document.getElementById('ageVal').innerText = `${player.age} лет, ${player.month} мес.`

</script>

  </body>
</html>
