<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>2048 Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="logo">2048</div>
      <div class="stats">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span id="best">0</span>
        </div>
        <div class="stat">
          <span class="label">XP</span>
          <span id="xp">0</span>
        </div>
      </div>
    </header>

    <main>
      <div class="controls">
        <button id="new-game">New game</button>
        <button id="shop-btn">Shop (soon)</button>
      </div>

      <div id="game-container">
        <div id="grid"></div>
        <div id="overlay" class="hidden">
          <div class="overlay-content">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-text"></p>
            <button id="try-again">Try again</button>
          </div>
        </div>
      </div>
    </main>

    <div id="shop-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Shop (soon)</h2>
        <p>Visual upgrades and themes will be available here.</p>
        <ul>
          <li>Tile themes (neon, pastel, dark)</li>
          <li>Board skins</li>
          <li>XP-based unlocks</li>
        </ul>
        <button id="close-shop">Close</button>
      </div>
    </div>
  </div>

  <!-- Telegram WebApp init (опционально, если уже встраиваешь) -->
  <!-- <script src="https://telegram.org/js/telegram-web-app.js"></script> -->

  <script src="main.js"></script>
</body>
</html>
