<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Dota 2 Matches – Telegram Mini App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #e5e7eb);
        }

        .container {
            padding: 16px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        button {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--tg-theme-button-color, #22c55e);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 14px;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .status {
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.8;
        }

        .matches {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            border-radius: 10px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .teams {
            font-weight: 600;
            font-size: 14px;
        }

        .time {
            font-size: 12px;
            opacity: 0.8;
        }

        .tournament {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .odds-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .odd-pill {
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(30, 64, 175, 0.4);
            font-size: 12px;
        }

        .odd-label {
            opacity: 0.8;
            margin-right: 4px;
        }

        .empty {
            font-size: 13px;
            opacity: 0.7;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Dota 2 – ближайшие матчи</h1>
    <button id="loadBtn">Обновить список</button>
    <div class="status" id="status">Нажмите «Обновить список», чтобы загрузить матчи.</div>
    <div class="matches" id="matches"></div>
</div>

<script src="app.js"></script>
</body>
</html>
