<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Sim: Evolution</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2c3e50;
            --accent: #e67e22;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .app {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            height: 85vh;
        }
        
        /* Header */
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 4px solid rgba(255,255,255,0.3);
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 22px; font-weight: bold; margin: 0; }
        .age { font-size: 14px; opacity: 0.9; margin-top: 5px; background: rgba(0,0,0,0.2); display: inline-block; padding: 2px 10px; border-radius: 10px; }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }
        .stat-box {
            background: white;
            padding: 8px 4px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .stat-val { font-weight: bold; font-size: 14px; display: block; margin-top: 4px; }
        .stat-icon { font-size: 18px; }

        /* Log */
        .log-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #fff;
        }
        .log-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #ddd;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
            line-height: 1.4;
        }
        .log-item.good { border-left-color: var(--success); background: #f0fff4; }
        .log-item.bad { border-left-color: var(--danger); background: #fff5f5; }
        .log-item.info { border-left-color: var(--primary); }
        .log-meta { font-size: 11px; color: #999; margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Controls */
        .controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }
        .main-btn:active { transform: scale(0.98); }

        /* Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal {
            background: white;
            width: 85%;
            max-width: 320px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
 .event-emoji { font-size: 60px; margin-bottom: 15px; display: block; }
 .event-text { font-size: 16px; margin-bottom: 20px; line-height: 1.5; color: #333; font-weight: 500; }
        
 .выбор-btn {
 ширина: 100%;
 отступ: 14px;
 нижнее поле: 10px;
 фон: #f8f9fa;
 граница: 1px сплошная #e1e4e8;
 радиус границы: 12px;
 размер шрифта: 14px;
 курсор: указатель;
 выравнивание текста: по левому краю;
 переход: 0.2с;
 цвет: #333;
 положение: относительное;
 переполнение: скрытое;
 }
 .выбор-btn: наведение курсора { фон: #eef2f5; border-color: #d1d5db; }
 .choice-btn strong { отображение: блок; margin-bottom: 2px; размер шрифта: 15px; }
 .choice-btn small { цвет: #777; размер шрифта: 12px; }

        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: #f9f9f9;
        }
        input:focus, select:focus { border-color: var(--primary); background: #fff; }
    </style>
</head>
<body>

<div class="app">
    <!-- Start Screen -->
    <div id="startScreen">
        <h1 style="color: var(--primary); margin-bottom: 10px;">Симулятор Жизни</h1>
        <p style="color: #777; margin-bottom: 40px;">Создайте свою уникальную историю</p>
        
        <input type="text" id="nameInput" placeholder="Введите имя" maxlength="15">
        <select id="genderInput">
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
        </select>
        
        <button class="main-btn" onclick="game.init()">Начать новую жизнь</button>
    </div>

    <!-- Game UI -->
    <div class="header">
        <div class="avatar"><img id="avatarImg" src="" alt="Avatar"></div>
        <h2 class="name" id="uiName">Имя</h2>
        <div class="age" id="uiAge">0 лет</div>
    </div>

    <div class="stats">
        <div class="stat-box"><span class="stat-icon">❤️</span><span class="stat-val" id="uiHealth">100%</span></div>
        <div class="stat-box"><span class="stat-icon">😄</span><span class="stat-val" id="uiHappy">100%</span></div>
        <div class="stat-box"><span class="stat-icon">🧠</span><span class="stat-val" id="uiSmart">0</span></div>
        <div class="stat-box"><span class="stat-icon">💵</span><span class="stat-val" id="uiMoney">0$</span></div>
    </div>

    <div class="log-area" id="logArea">
        <!-- Логи будут здесь -->
    </div>

    <div class="controls">
        <button class="main-btn" id="nextBtn" onclick="game.nextTurn()">Прожить полгода</button>
    </div>

    <!-- Event Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <span class="event-emoji" id="mEmoji">❓</span>
            <div class="event-text" id="mText">Текст события</div>
            <div id="mChoices"></div>
        </div>
    </div>
</div>

<!-- Подключаем файл со сценариями -->
<script src="scenarios.js"></script>

<script>
    const game = {
        data: {
            age: 0, // в полугодиях (0.5 года = 1 ход)
            name: "",
            gender: "male",
            stats: { health: 100, happy: 100, smart: 0, money: 0, reputation: 0 },
            flags: {}, // Память игры (какие события произошли)
            isGameOver: false
        },

        init: function() {
            const name = document.getElementById('nameInput').value.trim();
            if(!name) return alert("Пожалуйста, введите имя!");
            
            this.data.name = name;
            this.data.gender = document.getElementById('genderInput').value;
            
            // Генерация аватара
            const seed = Math.random().toString(36).substring(7);
            const hair = this.data.gender === 'male' ? 'short01,short02,short03' : 'long01,long02,long03';
            document.getElementById('avatarImg').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}&hair=${hair}&backgroundColor=b6e3f4`;
            
            document.getElementById('startScreen').style.display = 'none';
            this.updateUI();
            this.log("Вы родились! Добро пожаловать в этот мир.", "info");
        },

        nextTurn: function() {
            if(this.data.isGameOver) return location.reload();

            this.data.age++;
            const years = Math.floor(this.data.age / 2);

            // Проверка условий поражения
            if(this.data.stats.health <= 0) return this.gameOver("Здоровье упало до нуля. R.I.P.");
            if(this.data.stats.happy <= 0) return this.gameOver("Депрессия поглотила вас. Вы сдались.");
            if(years > 18) return this.gameOver("Совершеннолетие! Демо-версия окончена.");

            // Поиск события
            const event = this.findEvent(years);
            
            if(event) {
                this.showEvent(event);
            } else {
                this.passiveTurn(years);
            }
            
            this.updateUI();
        },

        findEvent: function(years) {
            // Проверка наличия базы сценариев
            if(typeof SCENARIOS === 'undefined') {
                this.log("Ошибка: файл scenarios.js не найден!", "bad");
                return null;
            }

            // Фильтр доступных событий
            const available = SCENARIOS.filter(s => {
                // 1. Проверка возраста (точное число или диапазон [min, max])
                if(Array.isArray(s.age)) {
                    if(years < s.age[0] || years > s.age[1]) return false;
                } else {
                    if(s.age !== years) return false;
                }
                
                // 2. Проверка повторов (если событие уже было, не показываем)
                if(this.data.flags[s.id]) return false;

                // 3. Проверка требований (req)
                if(s.req) {
                    // Пол
                    if(s.req.gender && s.req.gender !== this.data.gender) return false;
                    
                    // Статы (например, smart >= 50)
                    if(s.req.stat) {
                        // Парсим требование вида { stat: "smart", val: 50 }
                        // В scenarios.js это может быть записано как req: { stat: "smart", val: 50 }
                        // Или упрощенно, если мы договоримся о структуре.
                        // Сейчас код ожидает структуру: req: { stat: "smart", val: 50 }
                        if(this.data.stats[s.req.stat] < s.req.val) return false;
                    }
                    
                    // Флаги (нужно, чтобы событие X уже случилось)
                    if(s.req.flag && !this.data.flags[s.req.flag]) return false;
                    
                    // Анти-флаги (событие не должно было случиться)
                    if(s.req.noFlag && this.data.flags[s.req.noFlag]) return false;
                }

                return true;
            });

            if(available.length === 0) return null;
            
            // Выбираем случайное из доступных
            return available[Math.floor(Math.random() * available.length)];
        },

        showEvent: function(event) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('mEmoji').innerText = event.emoji;
            document.getElementById('mText').innerText = event.text;
            
            const choicesDiv = document.getElementById('mChoices');
            choicesDiv.innerHTML = '';

            event.choices.forEach(choice => {
                // Проверка требований для конкретного выбора
                if(choice.req) {
                    if(choice.req.stat && this.data.stats[choice.req.stat] < choice.req.val) return;
                    if(choice.req.flag && !this.data.flags[choice.req.flag]) return;
                    if(choice.req.money && this.data.stats.money < choice.req.money) return;
                }

                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<strong>${choice.txt}</strong>`;
                
                btn.onclick = () => {
                    this.resolveChoice(event, choice);
                    modal.style.display = 'none';
                };
                choicesDiv.appendChild(btn);
            });

            modal.style.display = 'flex';
        },

        resolveChoice: function(event, choice) {
            this.data.flags[event.id] = true; // Запоминаем, что событие произошло

            let outcome = choice;
            
            // Обработка шанса (если есть chance: 50)
            if(choice.chance) {
                const roll = Math.random() * 100;
                // Если успех - берем объект success, иначе fail (или сам choice если fail нет)
                if (roll <= choice.chance && choice.success) {
                    outcome = choice.success;
                } else if (choice.fail) {
                    outcome = choice.fail;
                }
            }

            // Применяем эффекты (eff)
            if(outcome.eff) {
                for(let key in outcome.eff) {
                    if(this.data.stats[key] !== undefined) {
                        this.data.stats[key] += outcome.eff[key];
                    }
                }
            }

            // Ставим флаг выбора (если есть)
            if(outcome.flag) this.data.flags[outcome.flag] = true;

            // Логирование
            // Определяем тип сообщения (плохое/хорошее)
            let type = 'info';
            if (outcome.eff) {
                if (outcome.eff.health < 0 || outcome.eff.happy < -5 || outcome.eff.money < 0) type = 'bad';
                if (outcome.eff.health > 0 || outcome.eff.happy > 5 || outcome.eff.money > 0) type = 'good';
            }
            
            this.log(outcome.log || "Вы сделали выбор.", type);
            this.updateUI();
        },

        passiveTurn: function(years) {
            // Если события нет, просто меняем статы немного
            const happyChange = Math.floor(Math.random() * 5) - 2;
            this.data.stats.happy += happyChange;
            
            // Иногда пишем в лог
            if(Math.random() > 0.7) {
                this.log(`Возраст ${years} лет. Жизнь идет своим чередом.`, "info");
            }
        },

        log: function(msg, type) {
            const area = document.getElementById('logArea');
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            
            const years = Math.floor(this.data.age / 2);
            const half = this.data.age % 2 === 0 ? "II" : "I";
            
            div.innerHTML = `<span class="log-meta">${years} лет (${half} пол.)</span>${msg}`;
            area.prepend(div);
        },

        updateUI: function() {
            // Ограничители (0-100)
            this.data.stats.health = Math.min(100, Math.max(0, this.data.stats.health));
            this.data.stats.happy = Math.min(100, Math.max(0, this.data.stats.happy));

            document.getElementById('uiName').innerText = this.data.name;
            document.getElementById('uiAge').innerText = Math.floor(this.data.age / 2) + " лет";
            
            document.getElementById('uiHealth').innerText = this.data.stats.health + "%";
            document.getElementById('uiHappy').innerText = this.data.stats.happy + "%";
            document.getElementById('uiSmart').innerText = this.data.stats.smart;
            document.getElementById('uiMoney').innerText = this.data.stats.money + "$";
        },

        gameOver: function(reason) {
            this.data.isGameOver = true;
            this.log(`🏁 ИГРА ОКОНЧЕНА: ${reason}`, "bad");
            
            // Меняем кнопку
            const btn = document.getElementById('nextBtn');
            btn.innerText = "Начать заново";
            btn.style.background = "#e74c3c";
            btn.onclick = () => location.reload();
            
            // Скрываем модалку если открыта
            document.getElementById('modalOverlay').style.display = 'none';
        }
    };
</script>

</body>
</html>
