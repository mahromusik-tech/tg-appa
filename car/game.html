(function(){

  const css = `

  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  // Создаём контейнер консоли
  const appConsole = document.createElement('div');
  appConsole.id = 'appConsole';
  appConsole.innerHTML = `

      <strong style="flex:1">App Console</strong>
      <button id="ac-clear">Clear</button>
      <button id="ac-toggle">Hide</button>

    <div class="body" id="ac-body"></div>

  document.body.appendChild(appConsole);
  const acBody = document.getElementById('ac-body');
  document.getElementById('ac-clear').onclick = ()=> acBody.innerHTML = '';
  document.getElementById('ac-toggle').onclick = (e)=>{
    if(acBody.style.display === 'none'){ acBody.style.display='block'; e.target.textContent='Hide'; }
    else { acBody.style.display='none'; e.target.textContent='Show'; }
  };

  function appendLine(text, cls){
    const d = document.createElement('div');
    d.className = 'line ' + (cls||'');
    d.textContent = (new Date()).toLocaleTimeString() + ' — ' + text;
    acBody.prepend(d);
  }

  // Сохраняем оригиналы
  const _log = console.log.bind(console);
  const _warn = console.warn.bind(console);
  const _error = console.error.bind(console);

  // Перехват console.*
  console.log = function(...args){ _log(...args); appendLine(args.map(a=>formatForConsole(a)).join(' '), 'info'); };
  console.warn = function(...args){ _warn(...args); appendLine(args.map(a=>formatForConsole(a)).join(' '), 'warn'); };
  console.error = function(...args){ _error(...args); appendLine(args.map(a=>formatForConsole(a)).join(' '), 'err'); };

  function formatForConsole(v){
    try { if(typeof v === 'object') return JSON.stringify(v); return String(v); } catch(e){ return String(v); }
  }

  // Глобальный перехват ошибок
  window.addEventListener('error', function(ev){
    const msg = `${ev.message} — ${ev.filename}:${ev.lineno}:${ev.colno}\nStack: ${ev.error && ev.error.stack ? ev.error.stack : '—'}`;
    appendLine(msg, 'err');
    console.error(ev.error || ev.message);
  });

  window.addEventListener('unhandledrejection', function(ev){
    const reason = ev.reason && ev.reason.stack ? ev.reason.stack : JSON.stringify(ev.reason);
    appendLine('UnhandledRejection: ' + reason, 'err');
    console.error('UnhandledRejection', ev.reason);
  });

  // Удобный вывод ошибок из try/catch
  window.appShowError = function(err){
    try{
      const text = err && err.stack ? err.stack : (typeof err === 'object' ? JSON.stringify(err) : String(err));
      appendLine('ERROR: ' + text, 'err');
      console.error(err);
    }catch(e){ _error('appShowError fail', e); }
  };

  // Инициализация: защищённое выполнение callback после DOMContentLoaded
  function safeInit(callback){
    document.addEventListener('DOMContentLoaded', ()=>{
      try{
        callback();
        appendLine('Инициализация завершена', 'info');
      }catch(e){
        appShowError(e);
      }
    });
  }

  // Экспортируем safeInit наружу, чтобы подключаемый код использовал его
  window.appSafeInit = safeInit;

  // Сообщение сразу (на случай, если код добавлен после DOMContentLoaded)
  appendLine('Встроенная консоль готова. Сообщения и ошибки будут показаны здесь.', 'info');

})(); // конец IIFE

    const START_MONEY = 150000;
let FINISH_GOAL = 5000000;
const PLAYER_COLORS = ['#e63946','#2a9d8f','#f4a261','#0077b6','#6a4c93'];

const boardTemplate = [
  { id:0, type:'start', name:'СТАРТ' },
  { id:1, type:'vedra', name:'ВЁДРА' },
  { id:2, type:'car', name:'БИТЬЕ', carClass:'bitye' },
  { id:3, type:'service', name:'АВТОСЕРВИС' },
  { id:4, type:'car', name:'ВЁДРА CELL', carClass:'vedra' },
  { id:5, type:'race', name:'ГОНКА (+1 старт)', raceBonus:'plus1' },
  { id:6, type:'car', name:'ПРЕМИУМ', carClass:'premium' },
  { id:7, type:'skupka', name:'СКУПКА' },
  { id:8, type:'car', name:'РЕТРО', carClass:'retro' },
  { id:9, type:'autopodbor', name:'АВТОПОДБОР' },
  { id:10, type:'race', name:'ГОНКА (переброс)', raceBonus:'reroll' },
  { id:11, type:'prokat', name:'ПРОКАТ' },
  { id:12, type:'finish', name:'ФИНИШ' }
];

const sampleVehicles = [
  { id:1, name:'LADA GRANTA', class:'vedra', buy:120000, sell:400000, repair:130000 },
  { id:2, name:'ZAZ TAVRIA', class:'bitye', buy:40000, sell:100000, repair:70000 },
  { id:3, name:'MOSKVICH', class:'bitye', buy:60000, sell:120000, repair:80000 },
  { id:4, name:'FORD FOCUS', class:'premium', buy:250000, sell:600000, repair:180000 },
  { id:5, name:'TOYOTA COROLLA', class:'premium', buy:300000, sell:700000, repair:200000 },
  { id:6, name:'BMW 3', class:'premium', buy:850000, sell:1400000, repair:350000 },
  { id:7, name:'MERCEDES C', class:'premium', buy:1100000, sell:1900000, repair:500000 },
  { id:8, name:'GAZ RETRO', class:'retro', buy:2200000, sell:3800000, restoration:900000 },
  { id:9, name:'VOLGA RETRO', class:'retro', buy:2500000, sell:4200000, restoration:1000000 },
  { id:10, name:'OPEL ASTRA', class:'premium', buy:320000, sell:650000, repair:210000 },
  { id:11, name:'NIVA 4x4', class:'vedra', buy:140000, sell:380000, repair:120000 },
  { id:12, name:'TRABANT', class:'bitye', buy:50000, sell:110000, repair:60000 },
  { id:13, name:'AUDI A4', class:'premium', buy:950000, sell:1600000, repair:420000 },
  { id:14, name:'RETRO LIMO', class:'retro', buy:2800000, sell:4800000, restoration:1200000 }
];

const defectDeck = [
  { id:1, name:'КАПИТАЛЬНЫЙ РЕМОНТ', multiplier:1.0 },
  { id:2, name:'ДВИГУН', multiplier:0.7 },
  { id:3, name:'КОРОБКА', multiplier:0.5 },
  { id:4, name:'ЭЛЕКТРИКА', multiplier:0.25 },
  { id:5, name:'КУЗОВ', multiplier:0.4 }
];

let players = [];
let deck = [];
let defects = [];
let order = [];
let curOrderIndex = 0;
let gameStarted = false;

const boardEl = document.getElementById('board');
const playersEl = document.getElementById('players');
const logEl = document.getElementById('log');
const turnInfo = document.getElementById('turnInfo');
const moveControls = document.getElementById('moveControls');
const stepButtons = document.getElementById('stepButtons');
const actionArea = document.getElementById('actionArea');
const cellActionText = document.getElementById('cellActionText');
const actionButtons = document.getElementById('actionButtons');
const endTurnBtn = document.getElementById('endTurnBtn');

document.getElementById('startBtn').onclick = startGame;
    document.getElementById('goalMoney').onchange = ()=>{ FINISH_GOAL = parseInt(document.getElementById('goalMoney').value) || FINISH_GOAL; };

function log(msg){ const d = document.createElement('div'); d.textContent = `${new Date().toLocaleTimeString()} — ${msg}`; logEl.prepend(d); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function formatMoney(n){ return (n/1000).toFixed(0) + 'k'; }
function rollDie(){ return Math.floor(Math.random()*6)+1; }

function buildBoard(){
  boardEl.innerHTML = '';
  const N = boardTemplate.length;
  const cx = boardEl.clientWidth/2;
  const cy = boardEl.clientHeight/2;
  const radius = Math.min(cx,cy) - 90;
  for(let i=0;i<N;i++){
    const c = boardTemplate[i];
    const angle = (i / N) _ Math.PI _ 2 - Math.PI/2;
    const x = cx + Math.cos(angle) * radius - 70;
    const y = cy + Math.sin(angle) * radius - 50;
    const el = document.createElement('div');
    el.className = 'cell';
    el.id = 'cell-'+c.id;
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.innerHTML = `<div class="title">${c.name}</div><div class="small">#${c.id} ${c.carClass?('['+c.carClass+']'):''}</div><div class="tokens" id="tokens-${c.id}"></div>`;
    boardEl.appendChild(el);
  }
}
    function renderPlayers(){
  playersEl.innerHTML = '';
  for(const c of boardTemplate){
    const t = document.getElementById('tokens-'+c.id);
    if(t) t.innerHTML = '';
  }
  for(const p of players){
    const div = document.createElement('div');
    div.className = 'player';
    div.id = 'player-'+p.id;
    const carsHtml = p.cars.map(c=>`<div style="margin:4px 0;padding:4px;border-radius:4px;background:#f0f8ff;font-size:12px">${c.name} — ${c.state}${c.defect?(' / '+c.defect.name):''} — Рем: ${formatMoney(c.repairCost||0)}</div>`).join('') || '<i>нет</i>';
    div.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><div style="width:18px;height:18px;background:${p.color};border-radius:50%"></div><b>${p.name}</b> ${p.bot?'<span class="small"> (БОТ)</span>':''}</div>
      <div>Деньги: <b>${formatMoney(p.money)}</b></div>
      <div>Позиция: <b>${p.pos}</b> — <span class="small">${boardTemplate[p.pos].name}</span></div>
      <div>Авто:<br>${carsHtml}</div>`;
    playersEl.appendChild(div);
    const tokens = document.getElementById('tokens-'+p.pos);
    if(tokens){
      const tok = document.createElement('div');
      tok.className = 'token';
      tok.style.background = p.color;
      tok.textContent = (p.id+1);
      tok.title = p.name + (p.bot? ' (БОТ)':'');
      tokens.appendChild(tok);
    }
  }
  const curPlayer = getCurrentPlayer();
  if(curPlayer){
    turnInfo.textContent = `${curPlayer.name} — ход. Деньги: ${formatMoney(curPlayer.money)}. Цель: ${formatMoney(FINISH_GOAL)}.`;
  } else turnInfo.textContent = '';
}

function startGame(){
  const num = Math.max(1, Math.min(5, parseInt(document.getElementById('numPlayers').value) || 2));
  players = [];
  for(let i=0;i<num;i++){
    players.push({ id:i, name:'Игрок '+(i+1), money:START_MONEY, pos:0, cars:[], color:PLAYER_COLORS[i%PLAYER COLORS.length], bot:false });
  }
  if(players[1]){ players[1].name = 'Бот'; players[1].bot = true; }
  deck = sampleVehicles.slice();
  defects = defectDeck.slice();
  shuffle(deck);
  shuffle(defects);
  order = players.map(p=>p.id);
  shuffle(order);
  curOrderIndex = 0;
  gameStarted = true;
  buildBoard();
  // каждому бесплатно выдаём машину (не ретро)
  for(const p of players){
    const freeCar = drawFreeCarForPlayer();
    if(freeCar){ p.cars.push(freeCar); log(`${p.name} бесплатно получил ${freeCar.name}${freeCar.defect?(' (дефект: '+freeCar.defect.name+')'):''}`); }
  }
  renderPlayers();
  log('Игра начата. Порядок: ' + order.map(i=>'Игрок '+(i+1)).join(', '));
  setTimeout(nextTurn, 300);
}

function drawFreeCarForPlayer(){
  let pickIndex = deck.findIndex(d=>d.class !== 'retro');
  if(pickIndex === -1){
    deck = sampleVehicles.slice(); shuffle(deck);
    pickIndex = deck.findIndex(d=>d.class !== 'retro');
    if(pickIndex === -1) pickIndex = 0;
  }
  const car = deck.splice(pickIndex,1)[0];
  let defect = null;
  if(car.class !== 'retro'){
    defect = defects[Math.floor(Math.random()*defects.length)];
  }
  const repairCost = car.class==='retro' ? (car.restoration||0) : Math.round((car.repair||0) * (defect?defect.multiplier:1));
  return { name:car.name, class:car.class, buy:car.buy, sell:car.sell, repairCost, defect:defect, state: car.class==='retro' ? 'need_restoration' : 'broken' };
}
    function nextTurn(){
  for(const p of players){
    if(p.money >= FINISH_GOAL){
      log(`Победитель: ${p.name} достиг цели ${formatMoney(p.money)}!`);
      alert(`Победитель: ${p.name}!`);
      gameStarted = false;
      moveControls.style.display = 'none';
      actionArea.style.display = 'none';
      return;
    }
  }
  if(!gameStarted) return;
  const pid = order[curOrderIndex % order.length];
  const player = players.find(p=>p.id===pid);
  renderPlayers();
  if(player.bot){
    moveControls.style.display = 'none';
    actionArea.style.display = 'none';
    log(`${player.name} (бот) готовится к ходу...`);
    setTimeout(()=>botTakeTurn(player), 800);
  } else {
    showMoveControls(player);
  }
}

function getCurrentPlayer(){ const pid = order[curOrderIndex % order.length]; return players.find(p=>p.id===pid); }

function showMoveControls(player){
  moveControls.style.display = 'block';
  actionArea.style.display = 'none';
  stepButtons.innerHTML = '';
  for(let s=1;s<=6;s++){
    const cost = Math.max(0, s-2) * 10000;
    const btn = document.createElement('button');
    btn.textContent = `${s} (стоимость ${formatMoney(cost)})`;
    btn.onclick = ()=>doMove(player, s, cost);
    stepButtons.appendChild(btn);
  }
  endTurnBtn.onclick = ()=>{ log(`${player.name} пропускает ход`); curOrderIndex++; nextTurn(); };
}

function doMove(player, steps, cost){
  if(player.money < cost){ alert('Нет денег на оплату хода'); return; }
  player.money -= cost;
  player.pos = (player.pos + steps) % boardTemplate.length;
  log(`${player.name} переместился на ${steps} и теперь на клетке ${boardTemplate[player.pos].name}`);
  moveControls.style.display='none';
  renderPlayers();
  handleCell(player, boardTemplate[player.pos]);
}

function handleCell(player, cell){
  actionArea.style.display = 'block';
  actionButtons.innerHTML = '';
  cellActionText.textContent = `Вы на ${cell.name}. Выберите действие:`;
  const skip = document.createElement('button'); skip.textContent = 'Не использовать клетку';
  skip.onclick = ()=>{ log(`${player.name} отказался от действия на ${cell.name}`); curOrderIndex++; nextTurn(); };
  actionButtons.appendChild(skip);

  if(cell.type === 'skupka'){
    const sell = document.createElement('button'); sell.textContent = 'Продать починённые машины';
    sell.onclick = ()=>sellAtSkupka(player);
    actionButtons.appendChild(sell);
  }
  if(cell.type === 'vedra'){
    const draw = document.createElement('button'); draw.textContent = 'Вытянуть машину (ВЁДРА) — недорогая';
    draw.onclick = ()=>drawVedra(player);
    actionButtons.appendChild(draw);
  }
  if(cell.type === 'car' && cell.carClass === 'retro'){
    const auctionBtn = document.createElement('button'); auctionBtn.textContent = 'Аукцион РЕТРО';
    auctionBtn.onclick = ()=>startRetroAuction(player);
    actionButtons.appendChild(auctionBtn);
  }
  if(cell.type === 'car' && cell.carClass && cell.carClass !== 'retro'){
    const buyBtn = document.createElement('button');
    buyBtn.textContent = `Купить машину класса ${cell.carClass}`;
    buyBtn.onclick = ()=>offerCarByClass(player, cell.carClass);
    actionButtons.appendChild(buyBtn);
  }
  if(cell.type === 'service'){
    const repairBtn = document.createElement('button'); repairBtn.textContent = 'Чинить/реставрировать машину';
    repairBtn.onclick = ()=>openService(player);
    const taxiBtn = document.createElement('button'); taxiBtn.textContent = 'Таксовать (бросок кубика *10k)';
    taxiBtn.onclick = ()=>taxiAction(player);
    actionButtons.appendChild(repairBtn); actionButtons.appendChild(taxiBtn);
  }
  if(cell.type === 'autopodbor'){
    const pickBtn = document.createElement('button'); pickBtn.textContent = 'Автоподбор (случайная машина, не ретро)';
    pickBtn.onclick = ()=>autopodbor(player);
    actionButtons.appendChild(pickBtn);
  }
  if(cell.type === 'prokat'){
    const rentBtn = document.createElement('button'); rentBtn.textContent = 'Сдать машину в прокат';
    rentBtn.onclick = ()=>rentCar(player);
    actionButtons.appendChild(rentBtn);
  }
  if(cell.type === 'race'){
    const raceBtn = document.createElement('button'); raceBtn.textContent = 'Начать гонку';
    raceBtn.onclick = ()=>startRace(player, cell.raceBonus);
    actionButtons.appendChild(raceBtn);
  }
  if(cell.type === 'finish'){
    const finishBtn = document.createElement('button'); finishBtn.textContent = 'Проверить финал (заявить победу)';
    finishBtn.onclick = ()=>tryFinish(player);
    actionButtons.appendChild(finishBtn);
  }

  renderPlayers();

  if(player.bot){
    actionArea.style.display = 'none';
    setTimeout(()=>botHandleCell(player, cell), 700);
  }
}

function sellAtSkupka(player){
  const sellable = player.cars.filter(c=>c.state==='repaired');
  if(sellable.length===0){ if(!player.bot) alert('Нет починённых машин для продажи'); curOrderIndex++; nextTurn(); return; }
  if(player.bot){
    const toSell = sellable.filter(c => (c.sell - c.buy) > 0);
    if(toSell.length===0){ log(`${player.name} (бот) решил не продавать`); curOrderIndex++; nextTurn(); return; }
    const car = toSell[0];
    player.money += car.sell;
    player.cars = player.cars.filter(x=>x!==car);
    log(`${player.name} (бот) продал ${car.name} за ${formatMoney(car.sell)}`);
    curOrderIndex++; nextTurn();
    return;
  }

  const options = sellable.map((c,i)=>`${i+1}. ${c.name} — продажа ${formatMoney(c.sell)}`).join('\n');
  const choice = prompt(`Выберите номер машины для продажи:\n${options}`);
  const idx = parseInt(choice)-1;
  if(isNaN(idx) || !sellable[idx]) return;
  const car = sellable[idx];
  player.money += car.sell;
  player.cars = player.cars.filter(x=>x!==car);
  log(`${player.name} продал ${car.name} за ${formatMoney(car.sell)}`);
  curOrderIndex++; nextTurn();
}

function drawVedra(player){
  let idx = deck.findIndex(d=>d.class==='vedra' || d.class==='bitye');
  if(idx === -1){
    deck = sampleVehicles.slice(); shuffle(deck);
    idx = deck.findIndex(d=>d.class==='vedra' || d.class==='bitye');
    if(idx === -1) idx=0;
}
  const card = deck.splice(idx,1)[0];
  const defect = card.class==='retro' ? null : defects[Math.floor(Math.random()*defects.length)];
  const repairCost = card.class==='retro' ? (card.restoration||0) : Math.round((card.repair||0) * (defect?defect.multiplier:1));
  if(player.bot){
    const buy = botDecideBuy(player, card, repairCost);
    if(buy){
      if(player.money >= card.buy){
        player.money -= card.buy;
        player.cars.push({ name:card.name, buy:card.buy, sell:card.sell, class:card.class, repairCost, defect, state: card.class==='retro' ? 'need_restoration' : 'broken' });
        log(`${player.name} (бот) купил ${card.name} за ${formatMoney(card.buy)}${defect?(' (дефект: '+defect.name+')'):''}`);
      } else {
        log(`${player.name} (бот) хотел купить ${card.name}, но не хватило денег`);
        deck.unshift(card);
      }
    } else {
      deck.unshift(card);
      log(`${player.name} (бот) отказался от ${card.name}`);
    }
    curOrderIndex++; nextTurn();
    return;
  }
  const want = confirm(`${player.name} вытянул ${card.name} (покупка ${formatMoney(card.buy)}). Хотите купить?`);
  if(want){
    if(player.money < card.buy){ alert('Нет денег'); curOrderIndex++; nextTurn(); return; }
    player.money -= card.buy;
    player.cars.push({ name:card.name, buy:card.buy, sell:card.sell, class:card.class, repairCost, defect: defect, state: card.class==='retro' ? 'need_restoration' : 'broken' });
    log(`${player.name} купил ${card.name} за ${formatMoney(card.buy)}${defect?(' (дефект: '+defect.name+')'):''}`);
  } else {
    log(`${player.name} отказался от ${card.name}`);
    deck.unshift(card);
  }
  curOrderIndex++; nextTurn();
}

function openService(player){
  const candidates = player.cars.filter(c=>c.state==='broken' || c.state==='need_restoration');
  if(candidates.length===0){ if(!player.bot) alert('Нет машин для ремонта/реставрации'); curOrderIndex++; nextTurn(); return; }
  if(player.bot){
    const choice = candidates.find(c => botDecideRepair(player, c));
    if(!choice){ log(`${player.name} (бот) решил не чинить`); curOrderIndex++; nextTurn(); return; }
    const car = choice;
    if(player.money < car.repairCost){ log(`${player.name} (бот) хотел чинить, но нет денег`); curOrderIndex++; nextTurn(); return; }
    player.money -= car.repairCost;
    car.state = 'repaired';
    log(`${player.name} (бот) отремонтировал ${car.name} за ${formatMoney(car.repairCost)}`);
    curOrderIndex++; nextTurn();
    return;
  }
  const list = candidates.map((c,i)=>`${i+1}. ${c.name} (${c.state}) — стоимость ${formatMoney(c.repairCost)}`).join('\n');
  const ans = prompt(`Выберите машину для ремонта (номер):\n${list}`);
  const idx = parseInt(ans)-1;
  if(isNaN(idx) || !candidates[idx]) return;
  const car = candidates[idx];
  if(player.money < car.repairCost){ alert('Не хватает денег'); return; }
  if(!confirm(`Потратить ${formatMoney(car.repairCost)} на ремонт ${car.name}?`)) return;
  player.money -= car.repairCost;
  car.state = 'repaired';
  log(`${player.name} отремонтировал ${car.name} за ${formatMoney(car.repairCost)}`);
  curOrderIndex++; nextTurn();
}

function taxiAction(player){
  const roll = rollDie();
  const gain = roll * 10000;
  player.money += gain;
  log(`${player.name} таксовал: бросил ${roll}, получил ${formatMoney(gain)}`);
  curOrderIndex++; nextTurn();
}

function rentCar(player){
  const rentable = player.cars.filter(c=>c.state==='repaired');
  if(rentable.length===0){ if(!player.bot) alert('Нет машин для проката'); curOrderIndex++; nextTurn(); return; }
  if(player.bot){
    const car = rentable[0];
    const reward = Math.round(car.sell*0.1);
    player.money += reward;
    log(`${player.name} (бот) сдал ${car.name} в прокат и получил ${formatMoney(reward)}`);
    curOrderIndex++; nextTurn();
    return;
  }
  const list = rentable.map((c,i)=>`${i+1}. ${c.name} — вознаграждение ${formatMoney(Math.round(c.sell*0.1))}`).join('\n');
  const choice = prompt(`Выберите машину для проката:\n${list}`);
  const idx = parseInt(choice)-1;
  if(isNaN(idx) || !rentable[idx]) return;
  const car = rentable[idx];
  const reward = Math.round(car.sell*0.1);
  player.money += reward;
  log(`${player.name} сдал ${car.name} в прокат и получил ${formatMoney(reward)}`);
  curOrderIndex++; nextTurn();
}

function startRace(player, bonusType){
  const others = players.filter(p=>p.id!==player.id);
  if(others.length===0){ if(!player.bot) alert('Нет соперников'); curOrderIndex++; nextTurn(); return; }
  let opponent = null;
  if(player.bot){
    opponent = others[Math.floor(Math.random()*others.length)];
  } else {
    const list = others.map((o,i)=>`${i+1}. ${o.name} (${formatMoney(o.money)})`).join('\n');
    const ans = prompt(`Выберите соперника для гонки:\n${list}`);
    const idx = parseInt(ans)-1;
    if(isNaN(idx) || !others[idx]) return;
    opponent = others[idx];
  }

  const stake = Math.min(Math.round(opponent.money * 0.5), Math.round(Math.min(player.money, opponent.money)));
  if(stake <= 0){ log('Ставка 0 — гонка не проводится'); curOrderIndex++; nextTurn(); return; }

  let r1 = rollDie();
  let r2 = rollDie();
  if(bonusType === 'plus1') r1 += 1;
  if(bonusType === 'reroll' && r1 === r2){
    r1 = rollDie(); r2 = rollDie();
  }
  log(`${player.name} бросил ${r1}, ${opponent.name} бросил ${r2}. Ставка ${formatMoney(stake)} (+100k от банка)`);

  let winner, loser;
  if(r1 > r2){ winner = player; loser = opponent; }
  else if(r2 > r1){ winner = opponent; loser = player; }
  else { log('Ничья — никто не получает ставку'); curOrderIndex++; nextTurn(); return; }

  const actualTransfer = Math.min(stake, loser.money);
  loser.money -= actualTransfer;
  winner.money += actualTransfer + 100000;
  log(`${winner.name} выиграл гонку и получает ${formatMoney(actualTransfer)} от ${loser.name} +100k из банка`);
  curOrderIndex++; nextTurn();
}

function startRetroAuction(initiator){
  let idx = deck.findIndex(d=>d.class==='retro');
  let car;
  if(idx === -1){
    idx = sampleVehicles.findIndex(v=>v.class==='retro');
    if(idx === -1){ if(!initiator.bot) alert('Нет ретро машин'); curOrderIndex++; nextTurn(); return; }
    car = sampleVehicles[idx];
  } else {
    car = deck.splice(idx,1)[0];
  }

  let currentBid = Math.max(car.buy || 0, 1000000);
  let currentWinner = null;
  const activePlayers = players.slice();
  let passes = 0;
  let i = 0;

  while(passes < activePlayers.length){
    const p = activePlayers[i % activePlayers.length];
    if(p.money < currentBid){ passes++; i++; continue; }
    if(p.bot){
      const maxPay = Math.max(0, Math.round((car.sell || 0) * 0.7) - (car.restoration||0));
      const willing = Math.min(p.money, maxPay);
      if(willing > currentBid && Math.random() > 0.4){
        currentBid = Math.min(p.money, currentBid + 100000);
        currentWinner = p;
        passes = 0;
        log(`${p.name} (бот) повысил ставку до ${formatMoney(currentBid)}`);
      } else {
        passes++;
      }
    } else {
      const ans = prompt(`${p.name}, текущая ставка ${formatMoney(currentBid)}. Введите новую ставку (кратность 100k) или ОК чтобы пасовать:`);
      const val = parseInt(ans);
      if(!isNaN(val) && val > currentBid && val <= p.money){
        currentBid = val;
        currentWinner = p;
        passes = 0;
      } else {
        passes++;
      }
    }
    i++;
  }

  if(!currentWinner){ log('Аукцион завершился без ставок'); deck.unshift(car); curOrderIndex++; nextTurn(); return; }

  // перевод денег и выдача машины
  const pay = Math.min(currentWinner.money, currentBid);
  currentWinner.money -= pay;
  currentWinner.cars.push({ name:car.name, buy:pay, sell:car.sell, class:car.class, repairCost:car.restoration||0, defect:null, state:'need_restoration' });
  log(`${currentWinner.name} выиграл аукцион за ${formatMoney(pay)} и получил ${car.name}`);
  curOrderIndex++; nextTurn();
}

function botDecideBuy(bot, car, repairCost){
  // простой эвристический критерий
  const potentialProfit = (car.sell || 0) - (car.buy || 0) - (repairCost || 0);
  if(potentialProfit > 200000 && bot.money > car.buy + repairCost) return true;
  if(car.class === 'vedra' && bot.money > car.buy + repairCost) return Math.random() > 0.5;
  return false;
}

function botDecideRepair(bot, car){
  // ремонт если прибыль после продажи перекрывает расходы или машина дорогая ретро
  if(car.state === 'need_restoration') return (car.sell - car.repairCost) > 100000 || bot.money > FINISH_GOAL*0.2;
  return (car.sell - car.repairCost) > 50000;
}

function botTakeTurn(bot){
  // бот бросает случайно 1-6, с учётом простого решения платить ли за дальние шаги
  const s = Math.floor(Math.random()*6)+1;
  const cost = Math.max(0, s-2) * 10000;
  if(bot.money < cost){
    log(`${bot.name} (бот) не может оплатить ход, пропускает`);
    curOrderIndex++; nextTurn();
    return;
    }
  doMove(bot, s, cost);
}

function botHandleCell(bot, cell){
  // простая последовательность действий: сервис > продажа > автоподбор > не использовать
  if(cell.type === 'service'){
    openService(bot); return;
  }
  if(cell.type === 'skupka'){
    sellAtSkupka(bot); return;
  }
  if(cell.type === 'autopodbor'){
    autopodbor(bot); return;
  }
  if(cell.type === 'vedra'){
    drawVedra(bot); return;
  }
  if(cell.type === 'car' && cell.carClass === 'retro'){
    startRetroAuction(bot); return;
  }
  // иначе пропустить
  log(`${bot.name} (бот) ничего не делает на ${cell.name}`);
  curOrderIndex++; nextTurn();
}

function tryFinish(player){
  if(player.money >= FINISH_GOAL){
    log(`${player.name} объявил о победе с ${formatMoney(player.money)}!`);
    alert(`${player.name} победил!`);
    gameStarted = false;
    moveControls.style.display = 'none';
    actionArea.style.display = 'none';
  } else {
    alert('Недостаточно денег для победы');
  }
}
