<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Merge Mini App</title>
    <!-- Подключаем Telegram Web Apps API -->
    <script src="https://telegram.org"></script>
    <!-- Подключаем физический движок Matter.js -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #game-container {
            border: 4px solid #555;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background: #333;
            overflow: hidden;
            width: 400px;
            height: 600px;
            max-width: 100vw;
            position: relative;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <div id="game-container"></div>

    <script src="app.js"></script>
</body>
</html>

</html>
