<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Magnate OS — Экономическая Стратегия</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f1115; color: #e4e6eb; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        .card { background: #181a20; border: 1px solid #2b2f36; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e222b; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2b2f36; }
        h2 { margin-top: 0; color: #f0b90b; font-size: 1.3rem; border-bottom: 1px solid #2b2f36; padding-bottom: 10px; }
        .grid-market { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .asset-row { display: flex; align-items: center; justify-content: space-between; background: #20242c; padding: 12px; border-radius: 8px; border: 1px solid #2b2f36; }
        .asset-info { flex: 2; }
        .asset-graph { flex: 2; text-align: center; }
        .asset-actions { flex: 2; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
        canvas { background: #15181f; border-radius: 4px; border: 1px solid #2b2f36; }
        .btn { background: #2ebd85; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .btn:hover { background: #26a671; }
        .btn-sell { background: #df294a; }
        .btn-sell:hover { background: #c6223e; }
        .btn-upgrade { background: #f0b90b; color: #000; }
        .btn-upgrade:hover { background: #dda80a; }
        .btn-next { background: #f0b90b; color: #111; width: 100%; padding: 18px; font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .btn-next:hover { background: #dda80a; }
        .news-box { height: 400px; overflow-y: auto; font-size: 13px; }
        .news-item { padding: 10px; border-bottom: 1px solid #2b2f36; line-height: 1.4; color: #b7bdc6; }
        .news-important { color: #f0b90b; font-weight: bold; }
        .stat-val { font-size: 18px; font-weight: bold; color: #fff; }
        .stat-lbl { font-size: 12px; color: #848e9c; }
        input[type="number"] { width: 70px; background: #15181f; color: #fff; border: 1px solid #474d57; padding: 6px; border-radius: 4px; text-align: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #2b2f36; color: #848e9c; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #f0b90b; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div><div class="stat-lbl">ТЕКУЩАЯ ДАТА</div><div class="stat-val"><span id="cur-month">Январь</span>, Год <span id="cur-year">1</span></div></div>
    <div><div class="stat-lbl">СВОБОДНЫЙ НАЛИЧНЫЙ БАЛАНС</div><div class="stat-val" style="color: #2ebd85;">$<span id="p-money">100,000</span></div></div>
    <div><div class="stat-lbl">РЕЙТИНГ ИНВЕСТОРА (M&A)</div><div class="stat-val"><span id="p-rating">50</span> / 100</div></div>
    <div><div class="stat-lbl">СТОИМОСТЬ ВСЕХ АКТИВОВ</div><div class="stat-val" style="color: #f0b90b;">$<span id="p-portfolio">100,000</span></div></div>
</div>

<div class="container">
    <div>
        <!-- ВКЛАДКИ РЫНКОВ -->
        <div class="tabs">
            <button class="tab-btn active" onclick="game.switchTab('stocks')">Фондовая Биржа (Акции)</button>
            <button class="tab-btn" onclick="game.switchTab('forex')">Валютный Рынок (Forex)</button>
            <button class="tab-btn" onclick="game.switchTab('my-biz')">Мой Бизнес</button>
        </div>

        <!-- СЕКЦИЯ: АКЦИИ -->
        <div id="sec-stocks" class="card">
            <h2>Котировки акций крупных корпораций</h2>
            <div id="stocks-list" class="grid-market"></div>
        </div>

        <!-- СЕКЦИЯ: ВАЛЮТА -->
        <div id="sec-forex" class="card" style="display:none;">
            <h2>Курсы мировых валют (база: USD)</h2>
            <div id="forex-list" class="grid-market"></div>
        </div>

        <!-- СЕКЦИЯ: МОЙ БИЗНЕС -->
        <div id="sec-my-biz" class="card" style="display:none;">
            <h2>Управление собственными предприятиями</h2>
            <div id="my-business-zone"></div>
        </div>
    </div>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <div>
        <div class="card" style="padding: 10px;">
            <button class="btn btn-next" onclick="game.nextTurn()">Рассчитать месяц →</button>
        </div>
        <div class="card">
            <h2>Лента финансовых новостей</h2>
            <div id="news-feed" class="news-box"></div>
        </div>
    </div>
</div>
<script>
const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

class Game {
        constructor() {
        this.money = 100000;
        this.rating = 50;
        this.monthIdx = 0;
        this.year = 1;
        this.currentTab = 'stocks';

        // ИИ Компании на рынке (Исправлено: добавлены массивы начальной истории)
        this.companies = [
            { id: 1, name: "Apex Tech Inc.", price: 120, history:, dividend: 4.5, stability: 65, owned: 0, volatility: 0.04, trend: 0.01, isAI: true },
            { id: 2, name: "Nord Crude Oil", price: 340, history:, dividend: 18.0, stability: 75, owned: 0, volatility: 0.03, trend: 0.005, isAI: true },
            { id: 3, name: "BioGen Lab", price: 45, history:, dividend: 0.0, stability: 35, owned: 0, volatility: 0.09, trend: 0.02, isAI: true },
            { id: 4, name: "Quantum Retail", price: 85, history:, dividend: 2.1, stability: 50, owned: 0, volatility: 0.04, trend: 0.008, isAI: true }
        ];

        // Фиатные валюты (Курс к USD)
        this.currencies = [
            { id: "EUR", name: "Евро (EUR/USD)", rate: 1.09, history: [1.11,1.10,1.08,1.09,1.11,1.12,1.10,1.09,1.08,1.07,1.08,1.09], owned: 0, volatility: 0.015 },
            { id: "CNY", name: "Юань (USD/CNY)", rate: 7.21, history: [7.15,7.18,7.20,7.22,7.25,7.23,7.21,7.19,7.22,7.24,7.23,7.21], owned: 0, volatility: 0.012 }
        ];

        // Свои компании игрока
        this.myCompanies = [];
        this.news = ["Инвестиционные рынки открыты. Рассчитывайте риски взвешенно."];
    }

    

    init() {
        this.render();
    }

    switchTab(tabId) {
        this.currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        if (event && event.target) {
            event.target.classList.add('active');
        }
        
        document.getElementById('sec-stocks').style.display = tabId === 'stocks' ? 'block' : 'none';
        document.getElementById('sec-forex').style.display = tabId === 'forex' ? 'block' : 'none';
        document.getElementById('sec-my-biz').style.display = tabId === 'my-biz' ? 'block' : 'none';
        this.render();
    }

    // Отрисовка мини-графиков цен на HTML Canvas
    drawChart(canvasId, data, isPositive = true) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const min = Math.min(...data) * 0.98;
        const max = Math.max(...data) * 1.02;
        const range = max - min;

        ctx.beginPath();
        ctx.strokeStyle = isPositive ? '#2ebd85' : '#df294a';
        ctx.lineWidth = 2;

        for (let i = 0; i < data.length; i++) {
            const x = (canvas.width / (data.length - 1)) * i;
            const y = canvas.height - ((data[i] - min) / range) * canvas.height;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    calculatePortfolioValue() {
        let stockVal = this.companies.reduce((sum, c) => sum + (c.owned * c.price), 0);
        let forexVal = this.currencies.reduce((sum, cur) => {
            return sum + (cur.id === "EUR" ? cur.owned * cur.rate : cur.owned / cur.rate);
        }, 0);
        let bizVal = this.myCompanies.reduce((sum, c) => sum + c.capitalization, 0);
        return this.money + stockVal + forexVal + bizVal;
    }

    render() {
        document.getElementById("p-money").innerText = Math.round(this.money).toLocaleString();
        document.getElementById("p-rating").innerText = Math.round(this.rating);
        document.getElementById("cur-month").innerText = MONTHS[this.monthIdx];
        document.getElementById("cur-year").innerText = this.year;
        document.getElementById("p-portfolio").innerText = Math.round(this.calculatePortfolioValue()).toLocaleString();

        // 1. Рендер акций
        if (this.currentTab === 'stocks') {
            const list = document.getElementById("stocks-list");
            list.innerHTML = "";
            this.companies.forEach(c => {
                const div = document.createElement("div");
                div.className = "asset-row";
                const direction = c.history[c.history.length-1] >= c.history[c.history.length-2];
                div.innerHTML = `
                    <div class="asset-info">
                        <strong>${c.name}</strong><br>
                        <small style="color:${direction?'#2ebd85':'#df294a'}">Цена: $${c.price.toFixed(2)}</small> | 
                        <small>Див. год: $${c.dividend}/акц.</small>
                    </div>
                    <div class="asset-graph"><canvas id="chart-stock-${c.id}" width="140" height="40"></canvas></div>
                    <div class="asset-info" style="text-align:center;">В портфеле: <br><strong>${c.owned} шт.</strong></div>
                    <div class="asset-actions">
                        <input type="number" id="qty-stock-${c.id}" value="10" min="1">
                        <button class="btn" onclick="game.tradeStock(${c.id}, true)">Купить</button>
                        <button class="btn btn-sell" onclick="game.tradeStock(${c.id}, false)">Продать</button>
                        <button class="btn btn-upgrade" onclick="game.proposeMAndA(${c.id})">Выкупить компанию</button>
                    </div>
                `;
                list.appendChild(div);
                this.drawChart(`chart-stock-${c.id}`, c.history, direction);
            });
        }

        // 2. Рендер Forex
        if (this.currentTab === 'forex') {
            const list = document.getElementById("forex-list");
            list.innerHTML = "";
            this.currencies.forEach(c => {
                const div = document.createElement("div");
                div.className = "asset-row";
                const direction = c.history[c.history.length-1] >= c.history[c.history.length-2];
                div.innerHTML = `
                    <div class="asset-info">
                        <strong>${c.name}</strong><br>
                        <small>Курс: ${c.rate.toFixed(4)}</small>
                    </div>
                    <div class="asset-graph"><canvas id="chart-forex-${c.id}" width="140" height="40"></canvas></div>
                    <div class="asset-info" style="text-align:center;">Резерв: <br><strong>${Math.round(c.owned).toLocaleString()} ед.</strong></div>
                    <div class="asset-actions">
                        <input type="number" id="qty-forex-${c.id}" value="1000" min="10">
                        <button class="btn" onclick="game.tradeForex('${c.id}', true)">Купить</button>
                        <button class="btn btn-sell" onclick="game.tradeForex('${c.id}', false)">Продать</button>
                    </div>
                `;
                list.appendChild(div);
                this.drawChart(`chart-forex-${c.id}`, cur.history, direction);
            });
        }

        // 3. Рендер своего бизнеса
        if (this.currentTab === 'my-biz') {
            const zone = document.getElementById("my-business-zone");
            if (this.myCompanies.length === 0) {
                zone.innerHTML = `
                    <p>У вас пока нет зарегистрированных холдингов. Открытие корпорации обеспечит постоянную генерацию прибыли, но требует регулярных инвестиций в развитие.</p>
                    <button class="btn btn-upgrade" onclick="game.establishCompany()">Учредить Корпорацию ($150,000)</button>
                `;
            } else {
                zone.innerHTML = "";
                this.myCompanies.forEach((biz, index) => {
                    const div = document.createElement("div");
                    div.style = "background:#20242c; padding:15px; border-radius:8px; border:1px solid #2b2f36; margin-bottom:15px;";
                    div.innerHTML = `
                        <h3>🏢 ${biz.name}</h3>
                        <p>Уровень мощностей: <strong>Lvl ${biz.level}</strong> | Персонал: <strong>${biz.level * 12} чел.</strong></p>
                        <p>Рыночная капитализация бизнеса: <strong>$${Math.round(biz.capitalization).toLocaleString()}</strong></p>
                        <p>Чистая прогнозируемая доходность: <span style="color:#2ebd85">+$${Math.round(biz.monthlyRevenue).toLocaleString()} / мес.</span></p>
                        <small>Дивидендный фонд компании накопил: $${Math.round(biz.dividendPool).toLocaleString()} (Выплата в Декабре)</small>
                        <div style="margin-top:15px; display:flex; gap:10px;">
                            <button class="btn btn-upgrade" onclick="game.upgradeBusiness(${index})">Модернизировать производство (-$${Math.round(biz.level * 40000)})</button>
                            <button class="btn" style="background:#008CBA;" onclick="game.injectCapital(${index})">Инвестировать $25,000 в капитализацию</button>
                        </div>
                    `;
                    zone.appendChild(div);
                });
            }
        }

        // Новости
        const newsFeed = document.getElementById("news-feed");
        newsFeed.innerHTML = this.news.map(n => `<div class="news-item">${n}</div>`).join("");
    }
    tradeStock(id, isBuy) {
        const c = this.companies.find(item => item.id === id);
        const qty = parseInt(document.getElementById(`qty-stock-${id}`).value);
        if (isNaN(qty) || qty <= 0) return;

        if (isBuy) {
            const cost = c.price * qty;
            if (this.money >= cost) {
                this.money -= cost;
                c.owned += qty;
                this.rating = Math.min(100, this.rating + (qty * 0.002));
                this.news.unshift(`🔹 Сделка: Куплено ${qty} шт. акций ${c.name} за $${Math.round(cost)}`);
            } else alert("Недостаточно капитала!");
        } else {
            if (c.owned >= qty) {
                const revenue = c.price * qty;
                this.money += revenue;
                c.owned -= qty;
                this.news.unshift(`🔸 Сделка: Продано ${qty} шт. акций ${c.name} за $${Math.round(revenue)}`);
            } else alert("У вас нет такого количества акций!");
        }
        this.render();
    }

    tradeForex(id, isBuy) {
        const cur = this.currencies.find(item => item.id === id);
        const qty = parseFloat(document.getElementById(`qty-forex-${id}`).value);
        if (isNaN(qty) || qty <= 0) return;

        let costInUSD = (id === "EUR") ? qty * cur.rate : qty / cur.rate;

        if (isBuy) {
            if (this.money >= costInUSD) {
                this.money -= costInUSD;
                cur.owned += qty;
                this.news.unshift(`💱 Forex: Приобретено ${qty} единиц ${id}`);
            } else alert("Недостаточно долларов для конвертации.");
        } else {
            if (cur.owned >= qty) {
                this.money += costInUSD;
                cur.owned -= qty;
                this.news.unshift(`💱 Forex: Продано ${qty} единиц ${id}`);
            } else alert("Недостаточно валютных резервов данного типа.");
        }
        this.render();
    }

    proposeMAndA(id) {
        const c = this.companies.find(item => item.id === id);
        const requiredRating = c.stability;
        const offerPrice = c.price * 1200; // Полный контроль с премией к рынку

        if (this.rating < requiredRating) {
            this.news.unshift(`<span class="news-important">❌ M&A Отказ: Совет директоров ${c.name} отклонил предложение. Ваш репутационный рейтинг инвестора (${Math.round(this.rating)}) ниже требуемого (${requiredRating}).</span>`);
            this.rating = Math.max(0, this.rating - 3);
            this.render();
            return;
        }

        if (this.money < offerPrice) {
            alert(`Для проведения сделки поглощения требуется капитал в размере $${offerPrice.toLocaleString()}`);
            return;
        }

        this.money -= offerPrice;
        c.owned += 1500; // Мажоритарный пакет
        this.rating = Math.min(100, this.rating + 20);
        this.news.unshift(`<span class="news-important">🎉 ПОГЛОЩЕНИЕ: Вы выкупили контрольный пакет акций ${c.name} за $${Math.round(offerPrice).toLocaleString()}. Компания перешла под ваше управление!</span>`);
        this.render();
    }

    establishCompany() {
        if (this.money >= 150000) {
            this.money -= 150000;
            this.myCompanies.push({
                name: "United Holdings Group",
                level: 1,
                capitalization: 150000,
                monthlyRevenue: 12000,
                dividendPool: 0
            });
            this.news.unshift("🏢 ЭКОНОМИКА: Вы зарегистрировали частную корпорацию. Развивайте мощности во вкладке 'Мой бизнес'.");
            this.render();
        } else alert("Регистрация компании и формирование уставного капитала стоят $150,000.");
    }

    upgradeBusiness(idx) {
        const biz = this.myCompanies[idx];
        const cost = biz.level * 40000;
        if (this.money >= cost) {
            this.money -= cost;
            biz.level += 1;
            biz.capitalization += cost * 1.2; 
            biz.monthlyRevenue = biz.level * 14000 + (Math.random() * 3000);
            this.news.unshift(`📈 Развитие: Компания ${biz.name} модернизирована до уровня ${biz.level}. Выпуск продукции увеличен.`);
            this.render();
        } else alert("Недостаточно средств для улучшения технологических линий.");
    }

    injectCapital(idx) {
        const biz = this.myCompanies[idx];
        if (this.money >= 25000) {
            this.money -= 25000;
            biz.capitalization += 25000;
            biz.monthlyRevenue += 1500;
            this.news.unshift(`💰 Капитал: В уставной фонд ${biz.name} внесено $25,000. Оценка стоимости на рынке выросла.`);
            this.render();
        }
    }

    // ПОМЕСЯЧНЫЙ ЦИКЛ СИМУЛЯЦИИ РЫНКА (Случайные блуждания)
    nextTurn() {
        this.monthIdx++;
        if (this.monthIdx >= 12) {
            this.monthIdx = 0;
            this.year++;
            this.payoutAnnualDividends(); 
        }

        // Плавное обновление котировок акций
        this.companies.forEach(c => {
            let shock = (Math.random() - 0.49) * 2; 
            let change = c.price * (c.trend + c.volatility * shock);
            c.price = Math.max(5, c.price + change);
            
            c.history.push(c.price);
            if (c.history.length > 12) c.history.shift(); 
        });

        // Обновление Forex валют
        this.currencies.forEach(cur => {
            let change = cur.rate * (Math.random() - 0.5) * cur.volatility;
            cur.rate = Math.max(0.01, cur.rate + change);
            cur.history.push(cur.rate);
            if (cur.history.length > 12) cur.history.shift();
        });

        // Начисление операционного дохода от своего бизнеса
        this.myCompanies.forEach(biz => {
            let monthlyNet = biz.monthlyRevenue;
            this.money += monthlyNet * 0.4; // 40% сразу на баланс игроку
            biz.dividendPool += monthlyNet * 0.6; // 60% копится на годовую выплату
        });

        this.generateMonthlyNews();
        this.render();
    }

    payoutAnnualDividends() {
        let totalReceived = 0;
        this.companies.forEach(c => {
            if (c.owned > 0) totalReceived += c.owned * c.dividend;
        });
        this.myCompanies.forEach(biz => {
            totalReceived += biz.dividendPool;
            biz.dividendPool = 0; 
        });

        if (totalReceived > 0) {
            this.money += totalReceived;
            this.news.unshift(`<span class="news-important">📅 ГОДОВОЙ ОТЧЕТ: Наступил новый финансовый год. На ваш счет зачислены годовые дивиденды в объеме +$${Math.round(totalReceived).toLocaleString()}</span>`);
        }
    }

    generateMonthlyNews() {
        const generalNews = [
            "Центральный банк сохранил ключевую ставку без изменений. Рынки стабильны.",
            "Индекс потребительского доверия демонстрирует умеренный и стабильный рост.",
            "Мировые логистические компании сообщают о нормализации тарифов на морские перевозки.",
            "Аналитики прогнозируют фазу консолидации активов в течение следующего квартала."
        ];
        
        const sectoralEvents = [
            { text: "Сырьевые рынки под давлением: Nord Crude Oil корректирует инвестиционные планы.", action: () => { this.companies.find(c => c.id === 2).price *= 0.96; } },
            { text: "Технологический сектор на подъеме! Акции Apex Tech показывают повышенный спрос.", action: () => { this.companies.find(c => c.id === 1).price *= 1.05; } },
            { text: "BioGen Lab заявляет об успешном завершении первой фазы испытаний нового препарата.", action: () => { this.companies.find(c => c.id === 3).price *= 1.08; } }
        ];

        let selectedNews = "";
        if (Math.random() > 0.5) {
            let ev = sectoralEvents[Math.floor(Math.random() * sectoralEvents.length)];
            selectedNews = `📢 ЭКСТРЕННО: ${ev.text}`;
            ev.action();
        } else {
            selectedNews = `📰 Обзор: ${generalNews[Math.floor(Math.random() * generalNews.length)]}`;
        }
        
        this.news.unshift(selectedNews);
        if (this.news.length > 30) this.news.pop();
    }
}

const game = new Game();
