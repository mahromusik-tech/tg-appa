<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Day Zero</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <div class="menu-content">
            <h1>DAY ZERO</h1>
            <p class="subtitle">Петля времени</p>
            
            <button class="btn-main" onclick="Game.startStory()">
                📖 ИСТОРИЯ
                <span>Сюжетный режим</span>
            </button>
            
            <button class="btn-main" onclick="Game.startArcade()">
                🔥 ВЫЖИВАНИЕ
                <span>Аркадный режим</span>
            </button>
        </div>
    </div>

    <!-- ЭКРАН 2: ИСТОРИЯ (НОВЕЛЛА) -->
     <div id="screen-menu" class="screen active">
        <h1>Student Life</h1>
        
        <div class="menu-buttons">
            <!-- Кнопка Аркады -->
            <button class="btn-menu" onclick="Game.startArcade()">Аркада (Reigns)</button>
            
            <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
            
            <!-- Кнопки Истории -->
            <button id="btn-continue" class="btn-menu" onclick="Game.continueStory()" style="display: none; background: #4a90e2;">Продолжить историю</button>
            <button class="btn-menu" onclick="Game.startStory()">Новая история</button>
        </div>
     </div>
        

    <!-- ЭКРАН 3: АРКАДА (REIGNS) -->
    <div id="screen-arcade" class="screen">
        <!-- Ресурсы сверху -->
        <div class="resources">
            <div class="res-item">❤️ <span id="res-hp">50</span></div>
            <div class="res-item">💰 <span id="res-money">50</span></div>
            <div class="res-item">🎓 <span id="res-study">50</span></div>
            <div class="res-item">🧠 <span id="res-sanity">50</span></div>
        </div>

        <!-- Карточка по центру -->
        <div class="card-container">
            <div class="card">
                <div class="card-image"></div>
                <p class="card-text">Макс зовет прогулять пары и пойти в бар.</p>
            </div>
            <!-- Кнопки действий (вместо свайпа пока кнопки) -->
            <div class="card-controls">
                <button class="btn-swipe left">Нет</button>
                <button class="btn-swipe right">Да</button>
            </div>
        </div>
    </div>

<!-- Сначала подключаем модули -->
    <script src="story.js"></script>
    
    <!-- Потом главный скрипт -->
    <script src="script.js"></script>
</body>
</html>
