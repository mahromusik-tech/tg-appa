<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Novel TMA</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем SDK Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu" class="screen active">
        <h1>Моя Новелла</h1>
        <button onclick="startGame()">Начать игру</button>
        <button onclick="showCredits()">Авторы</button>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" class="screen">
        <div id="stats-overlay">
    Рассудок: <span id="stat-sanity">0</span><br>
    Знание: <span id="stat-knowledge">0</span><br>
    Димон: <span id="stat-dimon">0</span><br>
    Лена: <span id="stat-lena">0</span>
</div>
        <div id="background"></div>
        
        <div id="character-container">
            <!-- Сюда будут добавляться спрайты персонажей -->
            <img id="character-sprite" src="" alt="" class="hidden">
        </div>

        <div id="dialogue-box">
            <div id="speaker-name"></div>
            <div id="dialogue-text"></div>
            <div id="choices-container"></div>
        </div>
    </div>

    <!-- Экран концовки -->
    <div id="ending-screen" class="screen">
        <h2 id="ending-title"></h2>
        <p id="ending-desc"></p>
        <button onclick="location.reload()">В меню</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
