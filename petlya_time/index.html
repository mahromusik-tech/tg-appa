<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Day Zero</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <div class="menu-content">
            <h1>DAY ZERO</h1>
            <p class="subtitle">Петля времени</p>
            
            <button class="btn-main" onclick="Game.startStory()">
                📖 ИСТОРИЯ
                <span>Сюжетный режим</span>
            </button>
            
            <button class="btn-main" onclick="Game.startArcade()">
                🔥 ВЫЖИВАНИЕ
                <span>Аркадный режим</span>
            </button>
        </div>
    </div>

    <!-- ЭКРАН 2: ИСТОРИЯ (НОВЕЛЛА) -->
      <div id="screen-menu" class="screen active">
        <div class="menu-content">
            <h1 class="game-title">DAY ZERO</h1>
            <p class="game-subtitle">Петля времени</p>

            <div class="menu-buttons-list">
                <!-- Кнопка ПРОДОЛЖИТЬ (Скрыта по умолчанию) -->
                <div id="btn-continue-block" class="menu-card continue" onclick="Game.continueStory()" style="display: none;">
                    <div class="icon">⏯️</div>
                    <div class="text-group">
                        <h3>ПРОДОЛЖИТЬ</h3>
                        <p>Вернуться в петлю</p>
                    </div>
                </div>

                <!-- Кнопка ИСТОРИЯ -->
                <div class="menu-card" onclick="Game.startStory()">
                    <div class="icon">📖</div>
                    <div class="text-group">
                        <h3>НОВАЯ ИСТОРИЯ</h3>
                        <p>Сюжетный режим</p>
                    </div>
                </div>

                <!-- Кнопка ВЫЖИВАНИЕ -->
                <div class="menu-card" onclick="Game.startArcade()">
                    <div class="icon">🔥</div>
                    <div class="text-group">
                        <h3>ВЫЖИВАНИЕ</h3>
                        <p>Аркадный режим</p>
                    </div>
                </div>
            </div>
        </div>
      </div>
        

    <!-- ЭКРАН 3: АРКАДА (REIGNS) -->
    <div id="screen-arcade" class="screen">
        <!-- Ресурсы сверху -->
        <div class="resources">
            <div class="res-item">❤️ <span id="res-hp">50</span></div>
            <div class="res-item">💰 <span id="res-money">50</span></div>
            <div class="res-item">🎓 <span id="res-study">50</span></div>
            <div class="res-item">🧠 <span id="res-sanity">50</span></div>
        </div>

        <!-- Карточка по центру -->
        <div class="card-container">
            <div class="card">
                <div class="card-image"></div>
                <p class="card-text">Макс зовет прогулять пары и пойти в бар.</p>
            </div>
            <!-- Кнопки действий (вместо свайпа пока кнопки) -->
            <div class="card-controls">
                <button class="btn-swipe left">Нет</button>
                <button class="btn-swipe right">Да</button>
            </div>
        </div>
    </div>

<!-- Сначала подключаем модули -->
    <script src="story.js"></script>
    
    <!-- Потом главный скрипт -->
    <script src="script.js"></script>
</body>
</html>
