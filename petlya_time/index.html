<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Day Zero: Student Life</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <div class="menu-content">
            <h1 class="game-title">DAY ZERO</h1>
            <p class="game-subtitle">Петля времени</p>

            <div class="menu-buttons-list">
                <!-- Кнопка ИСТОРИЯ -->
                <div class="menu-card" onclick="Game.startStory()">
                    <div class="icon">📖</div>
                    <div class="text-group">
                        <h3>ИСТОРИЯ</h3>
                        <p>Сюжетный режим</p>
                    </div>
                </div>

                <!-- Кнопка АРКАДА -->
                <div class="menu-card" onclick="Game.startArcade()">
                    <div class="icon">🔥</div>
                    <div class="text-group">
                        <h3>ВЫЖИВАНИЕ</h3>
                        <p>Аркадный режим</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- АРКАДА -->
    <div id="screen-arcade" class="screen">
        <!-- Счетчик дней -->
        <div class="day-counter">ДЕНЬ <span id="day-count">1</span></div>
        <div class="resources">
            <div class="res-item">❤️ <span id="res-hp">50</span></div>
            <div class="res-item">💰 <span id="res-money">50</span></div>
            <div class="res-item">📚 <span id="res-study">50</span></div>
            <div class="res-item">🧠 <span id="res-sanity">50</span></div>
        </div>
        <div class="card-container">
            <div class="card">
                <div class="card-image"></div>
                <div class="card-text">Загрузка...</div>
            </div>
        </div>
        <div class="controls">
            <button class="btn-swipe left">Нет</button>
            <button class="btn-swipe right">Да</button>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
      <!-- ЭКРАН СЮЖЕТА -->
    <div id="screen-story" class="screen">
        <!-- Кнопка назад в меню -->
        <button class="btn-menu-small" onclick="Game.showScreen('menu')">🏠</button>
        
        <!-- Контейнер для текста и выборов -->
        <div id="story-container">
            <!-- Сюда скрипт будет добавлять текст и кнопки -->
        </div>
    </div>

    <script src="story.js"></script>
    <script src="script.js"></script>

        <!-- МОДАЛЬНОЕ ОКНО GAME OVER -->
    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-box">
            <h2>💀 GAME OVER</h2>
            <p id="gameover-reason">Причина смерти...</p>
            <div class="modal-stats">
                Прожито дней: <span id="final-days">0</span>
            </div>
            <button class="btn-restart" onclick="Game.restartArcade()">ПОПРОБОВАТЬ СНОВА</button>
            <button class="btn-menu" onclick="Game.showScreen('menu'); document.getElementById('modal-gameover').classList.remove('active')">В МЕНЮ</button>
        </div>
    </div>
</body>
</html>
